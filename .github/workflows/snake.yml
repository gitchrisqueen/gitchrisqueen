name: snake

# Builds the contribution-calendar snake once a day and publishes it to the
# orphan branch `output`. The README embeds the files from there.
#
# generate-snake  read-only: runs the pinned third-party snake generator with a
#                 read-only token, builds the static twins and checks every file.
# publish         the only job that can write: re-checks the files with scripts
#                 from main, then commits exactly four named SVGs to `output`.
# report / close  open, update and close the one issue for this workflow.
#
# On any ref other than main this workflow is a dry run: it uploads the
# artifact and writes nothing.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      inject_fault:
        description: "Fault-injection drill. 'none' is a normal run."
        type: choice
        default: none
        options:
          - none
          - bad-svg
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/snake.yml"

permissions: {}

jobs:
  generate-snake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Generate the snake with the read-only token
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: gitchrisqueen
          outputs: |
            raw/snake.svg?palette=github-light&color_dots=#ebedf0,#9c8c12,#8f7f10,#75680c,#4a4106&color_snake=#0d1117
            raw/snake-dark.svg?palette=github-dark&color_dots=#161b22,#7d6f17,#a89816,#c4b228,#e9d437&color_snake=#efe9d2

      - name: Build the animated copies and the static twins
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/make_snake_static.py raw/snake.svg dist/snake.svg --bg "#ffffff" --keep-animation
          python scripts/make_snake_static.py raw/snake-dark.svg dist/snake-dark.svg --bg "#0d1117" --keep-animation
          python scripts/make_snake_static.py raw/snake.svg dist/snake-static-light.svg --bg "#ffffff"
          python scripts/make_snake_static.py raw/snake-dark.svg dist/snake-static-dark.svg --bg "#0d1117"

      - name: Fault-injection drill
        env:
          INJECT_FAULT: ${{ inputs.inject_fault || 'none' }}
        run: |
          set -euo pipefail
          case "${INJECT_FAULT}" in
            none) exit 0 ;;
            bad-svg) ;;
            *)
              echo "::error::unknown inject_fault value"
              exit 1
              ;;
          esac
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/snake.svg")
          path.write_text(path.read_text(encoding="utf-8").replace("</svg>", "<script>drill</script></svg>"), encoding="utf-8")
          PY

      - name: Lint and size-check the SVGs
        run: |
          set -euo pipefail
          python scripts/lint_svg.py --profile chart --require-opaque-background --min-bytes 5000 --expect rect=100 dist/*.svg
          for f in snake.svg snake-dark.svg snake-static-light.svg snake-static-dark.svg; do
            size=$(stat -c %s "dist/${f}")
            echo "${f}: ${size} bytes"
            if [ "${size}" -lt 5000 ] || [ "${size}" -gt 1500000 ]; then
              echo "::error::${f} is outside the 5000..1500000 byte range"
              exit 1
            fi
          done
          sha256sum dist/*.svg

      - name: Upload the validated SVGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake-artifacts
          path: dist/*.svg
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: generate-snake
    if: needs.generate-snake.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: output-branch
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download the validated SVGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake-artifacts
          path: ${{ runner.temp }}/snake

      - name: Re-check the SVGs with the scripts from main
        env:
          SNAKE_DIR: ${{ runner.temp }}/snake
        run: |
          set -euo pipefail
          # Exactly four regular files with known names; nothing in them is executed.
          if [ "$(find "${SNAKE_DIR}" -mindepth 1 | wc -l)" -ne 4 ]; then
            echo "::error::the artifact does not hold exactly four files"
            exit 1
          fi
          for f in snake.svg snake-dark.svg snake-static-light.svg snake-static-dark.svg; do
            if [ ! -f "${SNAKE_DIR}/${f}" ] || [ -L "${SNAKE_DIR}/${f}" ]; then
              echo "::error::${f} is missing or is not a regular file"
              exit 1
            fi
          done
          python scripts/lint_svg.py --profile chart --require-opaque-background --min-bytes 5000 --expect rect=100 \
            "${SNAKE_DIR}/snake.svg" "${SNAKE_DIR}/snake-dark.svg" \
            "${SNAKE_DIR}/snake-static-light.svg" "${SNAKE_DIR}/snake-static-dark.svg"
          sha256sum "${SNAKE_DIR}"/*.svg

      - name: Commit the four SVGs to the output branch
        env:
          SNAKE_DIR: ${{ runner.temp }}/snake
        run: |
          set -euo pipefail
          files=(snake.svg snake-dark.svg snake-static-light.svg snake-static-dark.svg)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git fetch origin "+refs/heads/output:refs/remotes/origin/output"
            git checkout -B output refs/remotes/origin/output
          else
            git checkout --orphan output
            git rm -rf --quiet .
          fi
          for f in "${files[@]}"; do
            cp -- "${SNAKE_DIR}/${f}" "./${f}"
          done
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "The output branch already holds these files; nothing to commit."
            exit 0
          fi
          git commit --message "chore: refresh snake assets"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/output; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; fetching and rebasing."
            git fetch origin "+refs/heads/output:refs/remotes/origin/output"
            if ! git rebase refs/remotes/origin/output; then
              git rebase --abort || true
              echo "::error::rebase onto output failed"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1

  report:
    needs: [generate-snake, publish]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_NAME: snake
      LABEL: "profile-automation:snake"
      GENERATE_RESULT: ${{ needs.generate-snake.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/MAINTENANCE.md
    steps:
      - name: Open or update the failure issue
        run: |
          set -euo pipefail
          enabled="$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)"
          if [ "${enabled}" != "true" ]; then
            echo "Issues are disabled for this repository; nothing to report."
            exit 0
          fi
          # Every value in the body is a fixed word or a run URL built from run metadata.
          stage="unknown"
          if [ "${GENERATE_RESULT}" = "failure" ]; then
            stage="generate-snake"
          elif [ "${PUBLISH_RESULT}" = "failure" ]; then
            stage="publish"
          fi
          body_file="${RUNNER_TEMP}/issue-body.md"
          {
            echo "The scheduled \`${WORKFLOW_NAME}\` workflow failed."
            echo
            echo "- Stage that failed: \`${stage}\`"
            echo "- Run: ${RUN_URL}"
            echo "- Last update: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "The published snake files stay as they were when a run fails. Steps for this case: ${DOC_URL}"
          } > "${body_file}"
          gh label create "${LABEL}" --color "B60205" --description "Automated profile maintenance failures" >/dev/null 2>&1 || true
          existing="$(gh issue list --label "${LABEL}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file "${body_file}"
          else
            gh issue create --title "Profile automation failing: ${WORKFLOW_NAME}" --label "${LABEL}" --body-file "${body_file}"
          fi

  close:
    needs: [generate-snake, publish]
    if: needs.generate-snake.result == 'success' && needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: "profile-automation:snake"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close this workflow's open failure issue
        run: |
          set -euo pipefail
          enabled="$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)"
          if [ "${enabled}" != "true" ]; then
            echo "Issues are disabled for this repository; nothing to close."
            exit 0
          fi
          existing="$(gh issue list --label "${LABEL}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${existing}" ]; then
            echo "No open issue for this workflow."
            exit 0
          fi
          gh issue close "${existing}" --reason completed --comment "A later run finished cleanly: ${RUN_URL}"
