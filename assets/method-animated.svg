<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 342" width="520" height="342" role="img">
<title>How I work</title>
<desc>Five habits, each one from something that broke in the projects on this page: Start from work someone does by hand; Write the boundary before building; Put a real check where the model is weakest; Keep watching after it ships; Say what is not proven.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@keyframes dot{0%{transform:translateY(0)}80%,100%{transform:translateY(216px)}}.dot{animation:dot 20s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="520" height="342" fill="#0d1117"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#e9d437">How I work</text>
<text x="24" y="54" font-size="13" fill="#9ba7b4">Each habit comes from something that broke in the projects below.</text>
<line x1="40" y1="80" x2="40" y2="296" stroke="#30363d" stroke-width="2"/>
<circle cx="40" cy="80" r="13" fill="#161b22" stroke="#e9d437" stroke-width="1.5"/>
<text x="40" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d437">1</text>
<text x="68" y="79" font-size="16" font-weight="700" fill="#e6edf3">Start from work someone does by hand</text>
<text x="68" y="98" font-size="13" fill="#9ba7b4">Weekly attendance and grading; a LinkedIn routine.</text>
<circle cx="40" cy="134" r="13" fill="#161b22" stroke="#e9d437" stroke-width="1.5"/>
<text x="40" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d437">2</text>
<text x="68" y="133" font-size="16" font-weight="700" fill="#e6edf3">Write the boundary before building</text>
<text x="68" y="152" font-size="13" fill="#9ba7b4">Drafts and dry runs by default; a human reviews.</text>
<circle cx="40" cy="188" r="13" fill="#161b22" stroke="#e9d437" stroke-width="1.5"/>
<text x="40" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d437">3</text>
<text x="68" y="187" font-size="16" font-weight="700" fill="#e6edf3">Put a real check where the model is weakest</text>
<text x="68" y="206" font-size="13" fill="#9ba7b4">A compiler decides compile errors, not the model.</text>
<circle cx="40" cy="242" r="13" fill="#161b22" stroke="#e9d437" stroke-width="1.5"/>
<text x="40" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d437">4</text>
<text x="68" y="241" font-size="16" font-weight="700" fill="#e6edf3">Keep watching after it ships</text>
<text x="68" y="260" font-size="13" fill="#9ba7b4">Hourly drift check on the live app; daily health check.</text>
<circle cx="40" cy="296" r="13" fill="#161b22" stroke="#e9d437" stroke-width="1.5"/>
<text x="40" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d437">5</text>
<text x="68" y="295" font-size="16" font-weight="700" fill="#e6edf3">Say what is not proven</text>
<text x="68" y="314" font-size="13" fill="#9ba7b4">Caveats sit next to every number.</text>
<circle class="dot" cx="40" cy="80" r="5" fill="#e9d437"/>
</svg>
