<rect x="1" y="1" width="6" height="270" fill="#e9d437" clip-path="url(#r)"/>
<text x="26" y="34" font-size="13" fill="#e9d437">Instructor admin tool</text>
<text x="26" y="64" font-size="22" font-weight="700" fill="#e6edf3">CPCC Task Automation</text>
<text x="26" y="92" font-size="13.5" fill="#9ba7b4">Attendance, withdrawals and rubric grading for</text>
<text x="26" y="112" font-size="13.5" fill="#9ba7b4">my own courses, with a human review step.</text>
<line x1="26" y1="136" x2="366" y2="136" stroke="#30363d"/>
<text x="26" y="160" font-size="13" font-weight="700" fill="#e9d437">What broke</text>
<text x="26" y="182" font-size="13.5" fill="#e6edf3">The model called valid C++ "does not compile".</text>
<text x="26" y="202" font-size="13.5" fill="#e6edf3">A real compiler now makes that call.</text>
