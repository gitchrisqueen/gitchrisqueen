<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 272" width="392" height="272" role="img">
<title>CPCC Task Automation</title>
<desc>CPCC Task Automation. Attendance, withdrawals and rubric grading for my own courses, with a human review step. What broke: The model called valid C++ "does not compile". A real compiler now makes that call.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style>
