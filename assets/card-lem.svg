<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 262" width="392" height="262" role="img">
<title>LinkedIn Engagement Manager</title>
<desc>LinkedIn Engagement Manager. Builds a 30-day content plan, gates AI-written posts on quality, caps daily engagement. What broke: The live app sat behind new releases for a day, inside a green run. An hourly check now flags it.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style>
<rect width="392" height="262" fill="#0d1117"/>
<rect x="1" y="1" width="390" height="260" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="1" y="1" width="6" height="260" rx="3" fill="#e9d437"/>
<text x="26" y="34" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e9d437">LIVE WEB APP</text>
<text x="26" y="64" font-size="22" font-weight="700" fill="#e6edf3">LinkedIn Engagement Manager</text>
<text x="26" y="92" font-size="13.5" fill="#9ba7b4">Builds a 30-day content plan, gates AI-written</text>
<text x="26" y="112" font-size="13.5" fill="#9ba7b4">posts on quality, caps daily engagement.</text>
<line x1="26" y1="136" x2="366" y2="136" stroke="#30363d"/>
<text x="26" y="160" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e9d437">WHAT BROKE</text>
<text x="26" y="182" font-size="13.5" fill="#e6edf3">The live app sat behind new releases for a day,</text>
<text x="26" y="202" font-size="13.5" fill="#e6edf3">inside a green run. An hourly check now flags it.</text>
