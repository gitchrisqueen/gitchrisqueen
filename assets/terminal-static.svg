<title>About me, as a simulated terminal session</title>
<desc>A simulated terminal, not a real tool or a real session. First cqc --help lists four commands: build, audit, explain and hire. Then a run steps through ingest, llm, tool, eval, human review and ship. Then cqc about prints: Title: Applied AI, Forward-Deployed Engineer. Base: Jacksonville, Florida, remote. Status: open to Forward-Deployed Engineer roles. Builds LLM systems with real checks. Stack: Python, FastAPI, React, Docker. Models: LangChain, LiteLLM, OpenRouter. Rule: a real check beats a prompt. Off duty: books, billiards, aquariums.</desc>
