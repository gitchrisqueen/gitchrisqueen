<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" width="520" height="366" role="img">
<title>The cqc command line tool</title>
<desc>A terminal session with the cqc command line tool. First cqc --help lists four commands. Then it connects my skills over MCP and lists six tools: llm_audit, real_check, drift_watch, browser_flow, ci_pipeline and human_gate. Then it calls llm_audit on sample data and prints grades. Then cqc about prints: Title: Applied AI, Forward-Deployed Engineer. Base: Jacksonville, Florida, remote. Status: open to Forward-Deployed Engineer roles. Builds LLM systems with real checks. Stack: Python, FastAPI, React, Docker. Models: LangChain, LiteLLM, OpenRouter. Rule: a real check beats a prompt. Off duty: books, billiards, aquariums.</desc>
