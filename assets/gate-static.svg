<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img">
<title>The compiler gate</title>
<desc>Illustration, not a recording. A language model first judges valid C++ as not compiling; a real compiler then returns exit code 0, so the grade stands.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style>
<rect width="520" height="290" fill="#0d1117"/>
<rect x="8" y="8" width="504" height="274" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="30" cy="30" r="6" fill="#ff7b72"/>
<circle cx="50" cy="30" r="6" fill="#e9d437"/>
<circle cx="70" cy="30" r="6" fill="#3fb950"/>
<text x="260" y="35" text-anchor="middle" font-size="13" fill="#9ba7b4">the compiler gate (illustration)</text>
<text class="m" x="30" y="78" font-size="18" fill="#e9d437" xml:space="preserve">$ grade submission.cpp</text>
<text class="m" x="30" y="114" font-size="18" fill="#e6edf3" xml:space="preserve">LLM verdict: "does not compile"</text>
<text class="m" x="50" y="150" font-size="18" fill="#ff7b72" xml:space="preserve">wrong: the code is valid</text>
<text class="m" x="30" y="186" font-size="18" fill="#e9d437" xml:space="preserve">$ compile submission.cpp</text>
<text class="m" x="30" y="222" font-size="18" fill="#e6edf3" xml:space="preserve">compiler exit code: 0</text>
<text class="m" x="30" y="258" font-size="18" fill="#3fb950" xml:space="preserve">verdict: compiles, grade stands</text>
</svg>
