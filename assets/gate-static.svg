<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img">
<title>The compiler gate</title>
<desc>Illustration, not a recording. A language model first judges valid C++ as not compiling; a real compiler then returns exit code 0, so the grade stands. This is the check added in CPCC Task Automation.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style>
<rect width="800" height="312" fill="#0d1117"/>
<rect x="24" y="20" width="752" height="272" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="52" cy="44" r="6" fill="#ff7b72"/>
<circle cx="74" cy="44" r="6" fill="#e9d437"/>
<circle cx="96" cy="44" r="6" fill="#3fb950"/>
<text x="400" y="49" text-anchor="middle" font-size="12" fill="#9ba7b4">the compiler gate (illustration)</text>
<text class="m" x="52" y="92" font-size="18" fill="#e9d437" xml:space="preserve">$ grade submission.cpp</text>
<text class="m" x="52" y="128" font-size="18" fill="#e6edf3" xml:space="preserve">LLM verdict: "does not compile"<tspan fill="#ff7b72" font-weight="700">  wrong: the code is valid</tspan></text>
<text class="m" x="52" y="164" font-size="18" fill="#e9d437" xml:space="preserve">$ compile submission.cpp</text>
<text class="m" x="52" y="200" font-size="18" fill="#e6edf3" xml:space="preserve">compiler exit code: 0</text>
<text class="m" x="52" y="236" font-size="18" fill="#3fb950" xml:space="preserve">verdict: compiles. The grade stands.</text>
<text x="52" y="272" font-size="12" fill="#9ba7b4">Illustration of the real-compiler check added in CPCC Task Automation (pull request #267). Not a recording.</text>
</svg>
