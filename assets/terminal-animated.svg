<text class="m v0" x="26" y="66" font-size="16" fill="#e9d437" xml:space="preserve">$ cqc --help</text>
<g class="v2"><rect class="t1" x="24" y="51" width="123.2" height="21" fill="#161b22"/></g>
<text class="m v3" x="26" y="94" font-size="16" fill="#e6edf3" xml:space="preserve">cqc: applied AI, forward-deployed engineer</text>
<text class="m v4" x="26" y="126" font-size="16" fill="#9ba7b4" xml:space="preserve">USAGE     cqc &lt;command&gt;</text>
<text class="m v5" x="26" y="148" font-size="16" fill="#e9d437" xml:space="preserve">COMMANDS</text>
<text class="m v6" x="26" y="170" font-size="16" fill="#e6edf3" xml:space="preserve">  mcp      connect my skills as tools</text>
<text class="m v7" x="26" y="192" font-size="16" fill="#e6edf3" xml:space="preserve">  call     run one skill, read its report</text>
<text class="m v8" x="26" y="214" font-size="16" fill="#e6edf3" xml:space="preserve">  about    who I am</text>
<text class="m v9" x="26" y="236" font-size="16" fill="#e6edf3" xml:space="preserve">  hire     remote, Jacksonville FL</text>
<text class="m v10" x="26" y="66" font-size="16" fill="#e9d437" xml:space="preserve">$ cqc mcp connect skills</text>
<g class="v12"><rect class="t11" x="24" y="51" width="238.4" height="21" fill="#161b22"/></g>
<circle class="v13" cx="32" cy="90" r="4" fill="#e6edf3"/>
<text class="m v13" x="46" y="94" font-size="16" fill="#e6edf3">connecting to my skills over MCP</text>
