<text class="m v16" x="186" y="148" font-size="16" fill="#e6edf3">grade an LLM stack, A to F</text>
<text class="m v17" x="46" y="174" font-size="16" fill="#e9d437" font-weight="700">real_check</text>
<text class="m v17" x="186" y="174" font-size="16" fill="#e6edf3">a real check, not a guess</text>
<text class="m v18" x="46" y="200" font-size="16" fill="#e9d437" font-weight="700">drift_watch</text>
<text class="m v18" x="186" y="200" font-size="16" fill="#e6edf3">live vs released mismatch</text>
<text class="m v19" x="46" y="226" font-size="16" fill="#e9d437" font-weight="700">browser_flow</text>
<text class="m v19" x="186" y="226" font-size="16" fill="#e6edf3">web automation, dry-run modes</text>
<text class="m v20" x="46" y="252" font-size="16" fill="#e9d437" font-weight="700">ci_pipeline</text>
<text class="m v20" x="186" y="252" font-size="16" fill="#e6edf3">Actions that fail closed</text>
<text class="m v21" x="46" y="278" font-size="16" fill="#e9d437" font-weight="700">human_gate</text>
<text class="m v21" x="186" y="278" font-size="16" fill="#e6edf3">drafts; a person publishes</text>
<text class="m v22" x="26" y="66" font-size="16" fill="#e9d437" xml:space="preserve">$ cqc call llm_audit --sample</text>
