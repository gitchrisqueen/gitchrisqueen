<text x="260" y="35" text-anchor="middle" font-size="13" fill="#9ba7b4">simulated terminal (illustration)</text>
<text class="m v0" x="26" y="66" font-size="14" fill="#e9d437" xml:space="preserve">$ cqc --help</text>
<g class="v2"><rect class="t1" x="24" y="51" width="108.8" height="21" fill="#161b22"/></g>
<text class="m v3" x="26" y="94" font-size="14" fill="#e6edf3" xml:space="preserve">cqc: applied AI, forward-deployed engineer</text>
<text class="m v4" x="26" y="124" font-size="14" fill="#9ba7b4" xml:space="preserve">USAGE     cqc &lt;command&gt;</text>
<text class="m v5" x="26" y="144" font-size="14" fill="#e9d437" xml:space="preserve">COMMANDS</text>
<text class="m v6" x="26" y="164" font-size="14" fill="#e6edf3" xml:space="preserve">  build    ship LLM systems with real checks</text>
<text class="m v7" x="26" y="184" font-size="14" fill="#e6edf3" xml:space="preserve">  audit    grade an LLM stack, A to F</text>
<text class="m v8" x="26" y="204" font-size="14" fill="#e6edf3" xml:space="preserve">  explain  write down what broke</text>
<text class="m v9" x="26" y="224" font-size="14" fill="#e6edf3" xml:space="preserve">  hire     remote, Jacksonville FL</text>
<text class="m v10" x="26" y="66" font-size="14" fill="#e9d437" xml:space="preserve">$ cqc run --with-review</text>
<g class="v12"><rect class="t11" x="24" y="51" width="201.2" height="21" fill="#161b22"/></g>
<circle class="v13" cx="32" cy="94" r="4" fill="#e6edf3"/>
<text class="m v13" x="46" y="98" font-size="14" fill="#e6edf3" font-weight="700">ingest</text>
<text class="m v13" x="112" y="98" font-size="14" fill="#9ba7b4">the job someone does by hand</text>
<path class="v14" d="M470 93 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="v15" cx="32" cy="120" r="4" fill="#e6edf3"/>
<text class="m v15" x="46" y="124" font-size="14" fill="#e6edf3" font-weight="700">llm</text>
<text class="m v15" x="112" y="124" font-size="14" fill="#9ba7b4">drafts and dry runs, never auto-publish</text>
<path class="v16" d="M470 119 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="v17" cx="32" cy="146" r="4" fill="#e6edf3"/>
<text class="m v17" x="46" y="150" font-size="14" fill="#e6edf3" font-weight="700">tool</text>
<text class="m v17" x="112" y="150" font-size="14" fill="#9ba7b4">run the real check, not a guess</text>
<path class="v18" d="M470 145 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="v19" cx="32" cy="172" r="4" fill="#e6edf3"/>
<text class="m v19" x="46" y="176" font-size="14" fill="#e6edf3" font-weight="700">eval</text>
<text class="m v19" x="112" y="176" font-size="14" fill="#9ba7b4">score it before anyone sees it</text>
<path class="v20" d="M470 171 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="v21" cx="32" cy="198" r="4" fill="#e6edf3"/>
<text class="m v21" x="46" y="202" font-size="14" fill="#e6edf3" font-weight="700">human</text>
<text class="m v21" x="112" y="202" font-size="14" fill="#9ba7b4">a person approves</text>
<path class="v22" d="M470 197 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="v23" cx="32" cy="224" r="4" fill="#e6edf3"/>
<text class="m v23" x="46" y="228" font-size="14" fill="#e6edf3" font-weight="700">ship</text>
<text class="m v23" x="112" y="228" font-size="14" fill="#9ba7b4">then watch it after it ships</text>
<path class="v24" d="M470 223 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="m v25" x="46" y="260" font-size="14" fill="#3fb950">ready for review</text>
<text class="m v26" x="26" y="66" font-size="14" fill="#e9d437" xml:space="preserve">$ cqc about --verbose</text>
