<title>About me, as a simulated terminal session</title>
<desc>A simulated terminal, not a real tool or a real session. First cqc --help lists four commands. Then it connects my skills over MCP and lists six tools: llm_audit, real_check, drift_watch, browser_flow, ci_pipeline and human_gate. Then it calls llm_audit on synthetic sample data and prints sample grades. Then cqc about prints: Title: Applied AI, Forward-Deployed Engineer. Base: Jacksonville, Florida, remote. Status: open to Forward-Deployed Engineer roles. Builds LLM systems with real checks. Stack: Python, FastAPI, React, Docker. Models: LangChain, LiteLLM, OpenRouter. Rule: a real check beats a prompt. Off duty: books, billiards, aquariums.</desc>
