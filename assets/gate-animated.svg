<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="520" height="290" role="img">
<title>The compiler gate</title>
<desc>Illustration, not a recording. A language model first judges valid C++ as not compiling; a real compiler then returns exit code 0, so the grade stands.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@keyframes g0{0%,3.33%{opacity:0}6.11%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l0{animation:g0 18s linear infinite}@keyframes g1{0%,12.22%{opacity:0}15.00%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l1{animation:g1 18s linear infinite}@keyframes g2{0%,18.89%{opacity:0}21.67%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l2{animation:g2 18s linear infinite}@keyframes g3{0%,31.11%{opacity:0}33.89%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l3{animation:g3 18s linear infinite}@keyframes g4{0%,40.00%{opacity:0}42.78%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l4{animation:g4 18s linear infinite}@keyframes g5{0%,48.89%{opacity:0}51.67%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l5{animation:g5 18s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="520" height="290" fill="#0d1117"/>
<rect x="8" y="8" width="504" height="274" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="30" cy="30" r="6" fill="#ff7b72"/>
<circle cx="50" cy="30" r="6" fill="#e9d437"/>
<circle cx="70" cy="30" r="6" fill="#3fb950"/>
<text x="260" y="35" text-anchor="middle" font-size="13" fill="#9ba7b4">the compiler gate (illustration)</text>
<text class="m l0" x="30" y="78" font-size="18" fill="#e9d437" xml:space="preserve">$ grade submission.cpp</text>
<text class="m l1" x="30" y="114" font-size="18" fill="#e6edf3" xml:space="preserve">LLM verdict: "does not compile"</text>
<text class="m l2" x="50" y="150" font-size="18" fill="#ff7b72" xml:space="preserve">wrong: the code is valid</text>
<text class="m l3" x="30" y="186" font-size="18" fill="#e9d437" xml:space="preserve">$ compile submission.cpp</text>
<text class="m l4" x="30" y="222" font-size="18" fill="#e6edf3" xml:space="preserve">compiler exit code: 0</text>
<text class="m l5" x="30" y="258" font-size="18" fill="#3fb950" xml:space="preserve">verdict: compiles, grade stands</text>
</svg>
