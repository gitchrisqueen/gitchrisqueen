<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img">
<title>The compiler gate</title>
<desc>Illustration, not a recording. A language model first judges valid C++ as not compiling; a real compiler then returns exit code 0, so the grade stands. This is the check added in CPCC Task Automation.</desc>
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@keyframes g0{0%,3.33%{opacity:0}6.11%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l0{animation:g0 18s linear infinite}@keyframes g1{0%,13.33%{opacity:0}16.11%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l1{animation:g1 18s linear infinite}@keyframes g2{0%,28.89%{opacity:0}31.67%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l2{animation:g2 18s linear infinite}@keyframes g3{0%,38.89%{opacity:0}41.67%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l3{animation:g3 18s linear infinite}@keyframes g4{0%,50.00%{opacity:0}52.78%,91.11%{opacity:1}95.56%,100%{opacity:0}}.l4{animation:g4 18s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="800" height="312" fill="#0d1117"/>
<rect x="24" y="20" width="752" height="272" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="52" cy="44" r="6" fill="#ff7b72"/>
<circle cx="74" cy="44" r="6" fill="#e9d437"/>
<circle cx="96" cy="44" r="6" fill="#3fb950"/>
<text x="400" y="49" text-anchor="middle" font-size="12" fill="#9ba7b4">the compiler gate (illustration)</text>
<text class="m l0" x="52" y="92" font-size="18" fill="#e9d437" xml:space="preserve">$ grade submission.cpp</text>
<text class="m l1" x="52" y="128" font-size="18" fill="#e6edf3" xml:space="preserve">LLM verdict: "does not compile"<tspan fill="#ff7b72" font-weight="700">  wrong: the code is valid</tspan></text>
<text class="m l2" x="52" y="164" font-size="18" fill="#e9d437" xml:space="preserve">$ compile submission.cpp</text>
<text class="m l3" x="52" y="200" font-size="18" fill="#e6edf3" xml:space="preserve">compiler exit code: 0</text>
<text class="m l4" x="52" y="236" font-size="18" fill="#3fb950" xml:space="preserve">verdict: compiles. The grade stands.</text>
<text x="52" y="272" font-size="12" fill="#9ba7b4">Illustration of the real-compiler check added in CPCC Task Automation (pull request #267). Not a recording.</text>
</svg>
